# nginx.prod.conf — sirve el build estático del frontend (dist/).
#
# Este nginx NO es el gateway: vive dentro del contenedor `frontend` y solo
# entrega ficheros. El gateway sigue siendo la única entrada al sistema y
# proxya hacia aquí (upstream frontend:5173).

server {
    # 5173, el mismo puerto que usaba el dev server de Vite, para que el
    # upstream del gateway no cambie.
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión --------------------------------------------------------
    # El bundle ronda los 200 kB en crudo y ~55 kB comprimido: merece la pena.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # --- Caché -------------------------------------------------------------
    # Vite pone un hash del contenido en el nombre de cada asset
    # (index-D4cLWJ4_.js). Si el contenido cambia, cambia el nombre, así que
    # estos ficheros se pueden cachear para siempre sin riesgo de servir algo
    # obsoleto. Eso es "cache busting".
    location /assets/ {
        # Una sola cabecera: `expires` ya emite su propio Cache-Control y
        # combinarlo con add_header dejaba la respuesta con DOS Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html es la excepción: NO se cachea, porque es quien apunta a los
    # assets con hash. Si el navegador se quedara con una copia vieja, seguiría
    # pidiendo la versión anterior del bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- Rutas -------------------------------------------------------------
    # Hoy la aplicación no usa routing en cliente (no hay pushState ni rutas
    # con hash), así que el fallback no es estrictamente necesario. Se deja
    # preparado para cuando lo haya: cualquier ruta desconocida devuelve el
    # index y la SPA decide, en vez de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
