events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream hello_backend {
        server hello:3000;
    }
    upstream game_backend {
        server game-service:3001;
    }
    upstream frontend_backend {
        server frontend:5173;
    }

    # zi.irishawk.com NO pertenece a este proyecto: nginx responde 404 y NO sirve
    # la SPA (ni en HTTP ni en HTTPS). Al ser un server_name exacto, gana a los
    # bloques por defecto. Reutiliza el certificado existente solo para poder
    # completar el handshake TLS y devolver el 404 (el nombre no coincidirá, pero
    # el objetivo es no servir este proyecto en ese dominio).
    server {
        listen 80;
        listen 443 ssl;
        server_name zi.irishawk.com;
        ssl_certificate /etc/letsencrypt/live/42transcendence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/42transcendence.com/privkey.pem;
        return 404;
    }

    # HTTP (80): challenge ACME de Let's Encrypt + redirección a HTTPS
    server {
        listen 80;
        server_name 42transcendence.com www.42transcendence.com poke.42transcendence.com www.poke.42transcendence.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 42transcendence.com www.42transcendence.com poke.42transcendence.com www.poke.42transcendence.com localhost;

        # Let's Encrypt (renovado por el servicio certbot vía webroot)
        ssl_certificate /etc/letsencrypt/live/42transcendence.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/42transcendence.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # --- Cabeceras de seguridad (defensa en profundidad) ---
        # Esta CSP es la de PRODUCCION, endurecida para un build estatico:
        #   script-src 'self'  -> sin 'unsafe-inline', sin 'unsafe-eval', sin blob:
        #   worker-src 'self'  -> sin blob:
        # Verificado sobre el bundle real generado por `vite build`: no contiene
        # eval(), new Function(), new Worker() ni importScripts(), y la unica
        # dependencia de runtime del frontend es @transcendence/shared (codigo
        # propio). Ver docs/02-LOCAL_DEV.md seccion 15.
        #
        # style-src MANTIENE 'unsafe-inline' y no se puede quitar: index.html usa
        # atributos style="..." en decenas de elementos.
        #
        # En DESARROLLO el dev server de Vite necesita eval (HMR) y se rompe con
        # esta politica. Por eso el entrypoint 97-csp-dev.sh la relaja cuando
        # CSP_DEV=1, variable que solo pone docker-compose.override.yml.
        set $csp "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://play.pokemonshowdown.com https://raw.githubusercontent.com https://pokeapi.co; connect-src 'self' https://pokeapi.co https://raw.githubusercontent.com wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración para WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Enrutamiento según requerimientos.
        # NOTA (transición): hasta que existan auth-service y user-service como
        # microservicios propios, game-service expone /api/auth y /api/users.
        # Ver docs/03-ARCHITECTURE.md §3.
        location /api/auth {
            proxy_pass http://game_backend;
        }

        location /api/users {
            proxy_pass http://game_backend;
        }

        location /api/game {
            proxy_pass http://game_backend;
        }

        # Lobby multijugador (crear/buscar/unirse a partidas) — game-service.
        location /api/lobby {
            proxy_pass http://game_backend;
        }

        location /api/poke {
            proxy_pass http://game_backend;
        }

        # WebSockets (sync de tablero + chat) — servidos por game-service.
        location /ws {
            proxy_pass http://game_backend;
        }

        location /health {
            proxy_pass http://hello_backend/health;
        }

        # Frontend (SPA)
        location / {
            proxy_pass http://frontend_backend;
        }
    }
}
